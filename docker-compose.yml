version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sixsense-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # To mount external audio directory, uncomment the following line:
      # - /path/to/your/audio:/app/data/audio
    environment:
      - SIX_SENSE_DATA_DIR=/app/data
      - CET6_RAW_SOURCE_DIR=/app/data/audio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sixsense-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
